<main class="px-6 py-8 space-y-6 pb-20">
  <!-- Back Button -->
  <div class="mb-4">
    <button
      (click)="goBack()"
      class="flex items-center px-4 py-2 bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
      <i class="fas fa-arrow-left mr-2 text-gray-600 dark:text-gray-400"></i>
      <span class="text-gray-900 dark:text-white font-medium">Back</span>
    </button>
  </div>

  <!-- Coming Soon Section -->
  <div class="flex flex-col items-center justify-center min-h-[60vh] text-center">
    <!-- Icon -->
    <div class="w-24 h-24 bg-gradient-to-br from-red-500 to-red-600 rounded-full flex items-center justify-center mb-6 shadow-2xl">
      <i class="fas fa-puzzle-piece text-white text-3xl"></i>
    </div>

    <!-- Title -->
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-4">
      Coming Soon
    </h1>

    <!-- Description -->
    <p class="text-lg text-gray-600 dark:text-gray-400 mb-8 max-w-md">
      We're working hard to bring you amazing add-ons and extensions for your POS system. Stay tuned for updates!
    </p>

    <!-- Features Teaser -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-lg border border-gray-200 dark:border-gray-700 max-w-md w-full">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-white mb-4">
        What to Expect
      </h3>
      <div class="space-y-3 text-left">
        <div class="flex items-center">
          <i class="fas fa-check-circle text-green-500 mr-3"></i>
          <span class="text-gray-700 dark:text-gray-300">Inventory Management</span>
        </div>
        <div class="flex items-center">
          <i class="fas fa-check-circle text-green-500 mr-3"></i>
          <span class="text-gray-700 dark:text-gray-300">Advanced Reporting</span>
        </div>
        <div class="flex items-center">
          <i class="fas fa-check-circle text-green-500 mr-3"></i>
          <span class="text-gray-700 dark:text-gray-300">Customer Loyalty Program</span>
        </div>
        <div class="flex items-center">
          <i class="fas fa-check-circle text-green-500 mr-3"></i>
          <span class="text-gray-700 dark:text-gray-300">And Much More...</span>
        </div>
      </div>
    </div>
  </div>
</main>
