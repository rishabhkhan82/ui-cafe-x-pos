<div class="min-h-screen flex items-center justify-center gradient-bg dark:bg-gray-900 p-4">
  <div class="max-w-md w-full">
    <div class="glass-effect rounded-2xl shadow-2xl p-8 text-center animate-fadeInSlide">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-red-500/20 rounded-full mb-6">
        <span class="text-5xl">🔒</span>
      </div>

      <h1 class="text-3xl font-bold text-white mb-3 drop-shadow-lg">
        {{ pageTitle }}
      </h1>
      <p class="text-white/80 text-lg mb-8">{{ message }}</p>

      <button
        (click)="goBack()"
        class="inline-flex items-center px-6 py-3 bg-white text-red-600 font-semibold rounded-lg shadow-lg hover:bg-gray-100 transition-all duration-200 transform hover:scale-105"
      >
        <i class="fas fa-arrow-left mr-2"></i>
        Go Back to Login
      </button>
    </div>

    <p class="text-center text-white/60 text-sm mt-6">
      If you believe this is an error, please contact your administrator.
    </p>
  </div>
</div>
