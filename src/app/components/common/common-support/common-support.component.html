<div class="gradient-bg glass-effect p-8 max-w-lg mx-auto shadow-2xl animate-fadeInSlide mb-8">
  <div class="text-center mb-8">
    <div class="flex justify-center">
      <div class="w-16 h-16 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center shadow-lg mb-4">
        <div class="relative">
          <i class="fas fa-coffee text-white text-lg"></i>
        </div>
      </div>
    </div>
    <h2 class="text-3xl font-bold text-white mb-3 drop-shadow-lg">{{ supportDetails.siteName || 'Support Center' }}</h2>
    <div class="inline-flex items-center px-4 py-2 bg-red-500/20 rounded-full backdrop-blur-sm border border-red-400/30">
      <span class="w-2 h-2 bg-green-400 rounded-full mr-2 animate-pulse"></span>
      <p class="text-red-100 font-semibold">{{ supportDetails.availability }} Service</p>
    </div>
    <p class="text-white/90 mt-3 text-lg italic">{{ supportDetails.priority }}</p>
  </div>

  <div class="space-y-4">
    <div class="flex items-center p-4 bg-white/10 dark:bg-black/10 rounded-xl hover:bg-white/20 dark:hover:bg-black/20 transition-all duration-300 hover:transform hover:scale-105 hover:shadow-lg group">
      <div class="p-3 bg-red-500/20 rounded-lg mr-4 group-hover:bg-red-500/30 transition-colors">
        <span class="text-2xl">📱</span>
      </div>
      <div>
        <p class="font-semibold text-white">Mobile Support</p>
        <p class="text-white/80">{{ supportDetails.mobile }}</p>
      </div>
    </div>

    <div class="flex items-center p-4 bg-white/10 dark:bg-black/10 rounded-xl hover:bg-white/20 dark:hover:bg-black/20 transition-all duration-300 hover:transform hover:scale-105 hover:shadow-lg group">
      <div class="p-3 bg-red-500/20 rounded-lg mr-4 group-hover:bg-red-500/30 transition-colors">
        <span class="text-2xl">📧</span>
      </div>
      <div>
        <p class="font-semibold text-white">Email Support</p>
        <p class="text-white/80">{{ supportDetails.email }}</p>
      </div>
    </div>

    <div class="flex items-center p-4 bg-white/10 dark:bg-black/10 rounded-xl hover:bg-white/20 dark:hover:bg-black/20 transition-all duration-300 hover:transform hover:scale-105 hover:shadow-lg group">
      <div class="p-3 bg-red-500/20 rounded-lg mr-4 group-hover:bg-red-500/30 transition-colors">
        <span class="text-2xl">💬</span>
      </div>
      <div>
        <p class="font-semibold text-white">WhatsApp Support</p>
        <p class="text-white/80">{{ supportDetails.whatsapp }}</p>
      </div>
    </div>
  </div>

  <div class="pt-6 mt-6 border-t border-white/20">
    <p class="font-semibold text-white text-center mb-4">Connect With Us</p>
    <div class="flex justify-center space-x-6">
      <a href="{{ supportDetails.socialMedia.facebook }}" class="group">
        <div class="p-3 bg-white/10 rounded-full hover:bg-blue-600/20 transition-all duration-300 hover:transform hover:scale-110 hover:shadow-lg">
          <span class="text-2xl group-hover:animate-bounce">📘</span>
        </div>
      </a>
      <a href="{{ supportDetails.socialMedia.twitter }}" class="group">
        <div class="p-3 bg-white/10 rounded-full hover:bg-blue-400/20 transition-all duration-300 hover:transform hover:scale-110 hover:shadow-lg">
          <span class="text-2xl group-hover:animate-bounce">🐦</span>
        </div>
      </a>
      <a href="{{ supportDetails.socialMedia.instagram }}" class="group">
        <div class="p-3 bg-white/10 rounded-full hover:bg-pink-600/20 transition-all duration-300 hover:transform hover:scale-110 hover:shadow-lg">
          <span class="text-2xl group-hover:animate-bounce">📷</span>
        </div>
      </a>
    </div>
  </div>
</div>
