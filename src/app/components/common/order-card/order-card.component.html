<div class="bg-white dark:bg-gray-800 rounded-2xl p-4 shadow-sm border-l-2 border-red-500 flex flex-col">
  <!-- Top Section: Header and Items on left, Status and Dates on right -->
  <div class="flex justify-between mb-4">
    <!-- Left: Header and Items -->
    <div class="flex-1">
       <!-- Header -->
       <div class="mb-3">
          <p class="font-semibold text-gray-900 dark:text-white">#ORD-{{ order.order_id.split('-').pop() }} • Table {{ order.table_number }}</p>
          <p class="text-sm text-gray-500 dark:text-gray-400">{{ order.customer_name }}</p>
       </div>

      <!-- Items Summary -->
      <div>
        <p class="text-sm text-gray-700 dark:text-gray-300 font-medium">Items:</p>
        <p class="text-sm text-gray-600 dark:text-gray-400">{{ getItemsSummary(order) }}</p>
      </div>
    </div>

    <!-- Right: Status and Dates -->
    <div class="ml-4 text-right">
      <!-- Status -->
      <div class="mb-3">
        <span class="px-2 py-1 rounded-full text-sm font-medium"
              [class]="getOrderStatusBadgeClass(order)">
          {{ getOrderStatusText(order) }}
        </span>
      </div>

      <!-- Dates -->
      <div class="text-sm text-gray-500 dark:text-gray-400">
        <p>Created: {{ formatOrderTime(order.created_at) }}</p>
        <p>Updated: {{ formatOrderTime(order.updated_at) }}</p>
      </div>
    </div>
  </div>

  <!-- Bottom Buttons -->
  <div class="flex justify-between mt-auto">
    <button (click)="onViewOrder()" class="flex-1 mr-1 px-3 py-2 bg-blue-500 hover:bg-blue-600 text-white text-sm font-semibold rounded-lg transition-colors">
      View
    </button>
     <button (click)="onMarkOnTheWay()"
             [disabled]="!canShowOnTheWay()"
             class="flex-1 mx-1 px-3 py-2 text-sm font-semibold rounded-lg transition-colors"
             [class]="canShowOnTheWay() ? 'bg-orange-500 hover:bg-orange-600 text-white cursor-pointer' : 'bg-gray-300 dark:bg-gray-600 text-gray-500 cursor-not-allowed'">
       On The Way
     </button>
     <button (click)="onMarkServed()"
             [disabled]="!canShowServed()"
             class="flex-1 ml-1 px-3 py-2 text-sm font-semibold rounded-lg transition-colors"
             [class]="canShowServed() ? 'bg-green-500 hover:bg-green-600 text-white cursor-pointer' : 'bg-gray-300 dark:bg-gray-600 text-gray-500 cursor-not-allowed'">
       Served
     </button>
  </div>
</div>
