<div style="min-height: calc(100vh - 110px);" class="flex items-center justify-center bg-gradient-to-br from-primary-50 to-primary-100 dark:from-gray-900 dark:to-gray-800 p-4 py-12">
  <div class="max-w-xl w-full text-center">
    <div class="mb-6">
      <div class="w-16 h-16 mx-auto bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center mb-4">
        <i class="fas fa-hard-hat text-3xl text-primary-600 dark:text-primary-400"></i>
      </div>
      <h1 class="text-3xl md:text-4xl font-bold text-gray-900 dark:text-white mb-3">
        Under Construction
      </h1>
      <p class="text-lg text-gray-600 dark:text-gray-300 mb-1">
        We're building something amazing!
      </p>
      <p class="text-gray-500 dark:text-gray-400 text-sm">
        This feature is currently being developed and will be available soon.
      </p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 mb-6">
      <div class="flex items-center justify-center space-x-2 mb-4">
        <div class="w-2.5 h-2.5 bg-primary-600 rounded-full animate-pulse"></div>
        <div class="w-2.5 h-2.5 bg-primary-600 rounded-full animate-pulse" style="animation-delay: 0.2s;"></div>
        <div class="w-2.5 h-2.5 bg-primary-600 rounded-full animate-pulse" style="animation-delay: 0.4s;"></div>
      </div>

      <div class="space-y-3">
        <div class="flex items-center space-x-3 text-left">
          <div class="w-7 h-7 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-check text-green-600 dark:text-green-400 text-xs"></i>
          </div>
          <span class="text-gray-700 dark:text-gray-300 text-sm">Enhanced API security features</span>
        </div>
        <div class="flex items-center space-x-3 text-left">
          <div class="w-7 h-7 rounded-full bg-green-100 dark:bg-green-900/30 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-check text-green-600 dark:text-green-400 text-xs"></i>
          </div>
          <span class="text-gray-700 dark:text-gray-300 text-sm">Real-time analytics dashboard</span>
        </div>
        <div class="flex items-center space-x-3 text-left">
          <div class="w-7 h-7 rounded-full bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-spinner fa-spin text-yellow-600 dark:text-yellow-400 text-xs"></i>
          </div>
          <span class="text-gray-700 dark:text-gray-300 text-sm">Advanced rate limiting controls</span>
        </div>
        <div class="flex items-center space-x-3 text-left">
          <div class="w-7 h-7 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center flex-shrink-0">
            <i class="fas fa-circle text-gray-400 text-[10px]"></i>
          </div>
          <span class="text-gray-500 dark:text-gray-400 text-sm">Webhook integration</span>
        </div>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-center justify-center space-y-3 sm:space-y-0 sm:space-x-3">
      <button class="px-5 py-2.5 bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition-colors flex items-center space-x-2 text-sm">
        <i class="fas fa-bell text-xs"></i>
        <span>Notify Me</span>
      </button>
      <button (click)="goBack()" class="px-5 py-2.5 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center space-x-2 text-sm">
        <i class="fas fa-arrow-left text-xs"></i>
        <span>Go Back</span>
      </button>
    </div>

    <p class="mt-6 text-xs text-gray-500 dark:text-gray-400">
      Expected: <span class="font-semibold text-gray-700 dark:text-gray-300">Coming Soon</span>
    </p>
  </div>
</div>
