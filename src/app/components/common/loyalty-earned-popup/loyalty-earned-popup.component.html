<div *ngIf="isVisible" class="fixed bottom-24 left-0 right-0 z-[60] px-4 pointer-events-none">
  <div class="max-w-2xl mx-auto pointer-events-auto animate-slide-up">
    <div class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-xl rounded-2xl shadow-2xl border border-amber-200 dark:border-amber-700 overflow-hidden">
      <div class="bg-gradient-to-r from-amber-500 to-orange-500 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
            <i class="fas fa-coins text-white text-lg"></i>
          </div>
          <div>
            <p class="text-white font-bold text-sm md:text-base">Loyalty Points Earned!</p>
            <p class="text-white/80 text-xs" *ngIf="invoiceId">Invoice #{{ invoiceId }}</p>
          </div>
        </div>
        <button (click)="dismiss()" class="text-white/80 hover:text-white p-1 rounded-full hover:bg-white/10 transition-colors flex-shrink-0">
          <i class="fas fa-times text-sm"></i>
        </button>
      </div>

      <div class="px-4 py-4">
        <img src="/images/brand/loyalty-points.png" alt="Loyalty Points" class="mx-auto mb-3">
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">You Earned</p>
            <p class="text-3xl font-bold text-amber-600 dark:text-amber-400">
              +{{ pointsEarned }}
              <span class="text-sm font-medium text-gray-500 dark:text-gray-400 ml-1">pts</span>
            </p>
          </div>
          <div class="h-10 w-px bg-gray-200 dark:bg-gray-700 mx-4"></div>
          <div class="text-right">
            <p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-wide mb-1">Total Balance</p>
            <p class="text-xl font-bold text-gray-900 dark:text-white">
              {{ totalPoints }}
              <span class="text-sm font-medium text-gray-500 dark:text-gray-400 ml-1">pts</span>
            </p>
          </div>
        </div>

        <div class="mt-3 bg-amber-50 dark:bg-amber-900/20 rounded-lg px-3 py-2 flex items-center space-x-2">
          <i class="fas fa-info-circle text-amber-500 text-xs"></i>
          <p class="text-xs text-amber-700 dark:text-amber-300">
            {{ totalPoints }} points = ₹{{ totalPoints / 100 }} value on your next bill
          </p>
        </div>

        <div class="mt-3 flex items-center justify-end">
          <button (click)="viewLoyalty()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-medium rounded-lg transition-colors">
            View Loyalty
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
